<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fireGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="coreGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <rect width="400" height="300" fill="#1a1a1a"/>
  <rect x="20" y="20" width="360" height="260" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="2"/>
  
  <!-- Main explosion burst -->
  <circle cx="200" cy="150" r="80" fill="url(#fireGradient)" opacity="0.8"/>
  <circle cx="200" cy="150" r="50" fill="url(#coreGradient)" opacity="0.9"/>
  <circle cx="200" cy="150" r="25" fill="#ffffff" opacity="0.7"/>
  
  <!-- Flame tendrils -->
  <ellipse cx="130" cy="120" rx="20" ry="40" fill="#ff6500" opacity="0.7" transform="rotate(-30 130 120)"/>
  <ellipse cx="270" cy="120" rx="20" ry="40" fill="#ff6500" opacity="0.7" transform="rotate(30 270 120)"/>
  <ellipse cx="120" cy="180" rx="25" ry="35" fill="#ff4500" opacity="0.6" transform="rotate(-45 120 180)"/>
  <ellipse cx="280" cy="180" rx="25" ry="35" fill="#ff4500" opacity="0.6" transform="rotate(45 280 180)"/>
  <ellipse cx="200" cy="80" rx="30" ry="50" fill="#ff8c00" opacity="0.7"/>
  <ellipse cx="200" cy="220" rx="30" ry="50" fill="#ff8c00" opacity="0.7"/>
  
  <!-- Sparks and embers -->
  <circle cx="100" cy="100" r="3" fill="#ffff00"/>
  <circle cx="320" cy="110" r="2" fill="#ff8c00"/>
  <circle cx="80" cy="160" r="2" fill="#ffff00"/>
  <circle cx="340" cy="190" r="3" fill="#ff4500"/>
  <circle cx="110" cy="220" r="2" fill="#ff8c00"/>
  <circle cx="310" cy="240" r="2" fill="#ffff00"/>
  <circle cx="160" cy="60" r="2" fill="#ff4500"/>
  <circle cx="250" cy="50" r="3" fill="#ffff00"/>
  
  <!-- Heat waves -->
  <path d="M 50 250 Q 70 240 90 250 Q 110 260 130 250" stroke="#ff4500" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 270 250 Q 290 240 310 250 Q 330 260 350 250" stroke="#ff4500" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="18" fill="#ffff00" text-anchor="middle" font-weight="bold">FLAME BURST</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="14" fill="#ff8c00" text-anchor="middle">Explosive Fire Magic</text>
</svg>
